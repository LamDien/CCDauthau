name: Build Apple Packages (iOS & macOS)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apple:
    name: Build macOS (.dmg) & iOS (unsigned .ipa)
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Print Apple toolchain versions
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Resolve version from pubspec.yaml
        run: |
          VERSION_RAW="$(awk -F': *' '/^version:/{print $2; exit}' pubspec.yaml | tr -d '[:space:]')"
          APP_VERSION="${VERSION_RAW%%+*}"
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
          echo "Resolved APP_VERSION=${APP_VERSION}"

      - name: Install dependencies and verify code quality
        run: |
          flutter pub get
          dart analyze
          flutter test -r expanded --concurrency=1

      - name: Build & package macOS (.dmg)
        run: |
          flutter build macos --release --obfuscate --split-debug-info=build/macos/symbols
          chmod +x tool/package_macos_dmg.sh
          ./tool/package_macos_dmg.sh "${APP_VERSION}"

      - name: Build & package iOS (unsigned .ipa)
        run: |
          flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/ios/symbols
          chmod +x tool/package_ios_unsigned_ipa.sh
          ./tool/package_ios_unsigned_ipa.sh "${APP_VERSION}"

      - name: Verify packaged artifacts
        run: |
          ls -lh "build/macos/Build/Products/Release/CCDauthau-v${APP_VERSION}.dmg"
          ls -lh "build/ios/ipa/CCDauthau-v${APP_VERSION}-unsigned.ipa"

      - name: Upload macOS .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: CCDauthau-v${{ env.APP_VERSION }}-macos-dmg
          path: build/macos/Build/Products/Release/CCDauthau-v*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Upload iOS unsigned .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: CCDauthau-v${{ env.APP_VERSION }}-ios-unsigned-ipa
          path: build/ios/ipa/CCDauthau-v*-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Attach Apple packages to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/macos/Build/Products/Release/CCDauthau-v*.dmg
            build/ios/ipa/CCDauthau-v*-unsigned.ipa
